<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Component — Snippet Preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Lato:wght@300;400;700&display=swap">

  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

  <!--
    ════════════════════════════════════════════════════════════
    SNIPPET: Monthly Calendar Component
    
    To restore to events page:
      1. Copy the <section class="cal-section"> block below
      2. Paste into events/index.html where you want the calendar
      3. Make sure <script src="/js/events.js"> is loaded on that page
    ════════════════════════════════════════════════════════════
  -->

  <section
    class="cal-section"
    aria-labelledby="events-calendar-heading"
    data-testid="events-calendar"
  >
    <div class="cal-wrap">

      <div class="cal-header-wrap">
        <div class="cal-section-label">Community</div>
        <h2 id="events-calendar-heading" class="cal-section-title">Calendar</h2>
      </div>

      <!-- Month navigation -->
      <div class="cal-nav" data-testid="calendar-nav">
        <div
          class="cal-month-label"
          id="cal-month-label"
          aria-live="polite"
          aria-atomic="true"
          data-testid="calendar-month-label"
        ></div>
        <div class="cal-nav-btns" role="group" aria-label="Change month">
          <button class="cal-nav-btn" aria-label="Previous month" data-testid="cal-prev-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <button class="cal-nav-btn" aria-label="Next month" data-testid="cal-next-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Day-of-week headers -->
      <div class="cal-dow" aria-hidden="true">
        <div class="cal-dow-cell">Sun</div>
        <div class="cal-dow-cell">Mon</div>
        <div class="cal-dow-cell">Tue</div>
        <div class="cal-dow-cell">Wed</div>
        <div class="cal-dow-cell">Thu</div>
        <div class="cal-dow-cell">Fri</div>
        <div class="cal-dow-cell">Sat</div>
      </div>

      <!-- Calendar grid (rendered by events.js) -->
      <div
        class="cal-grid"
        id="cal-grid"
        role="grid"
        aria-label="Monthly event calendar"
        data-testid="calendar-grid"
      ></div>

      <!-- Events list for current month (rendered by events.js) -->
      <div class="cal-list" data-testid="calendar-event-list">
        <div class="cal-list-title">This Month</div>
        <div id="cal-event-list" role="list" aria-label="Upcoming events this month"></div>
      </div>

    </div>
    <!-- /.cal-wrap -->
  </section>

  <script src="/js/events.js"></script>
  <script src="/js/global.js"></script>
</body>
</html>
